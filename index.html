<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOKI 쇼츠 메이커</title>
<style>
body {
  background: #111827;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 25px;
}
h1 { color: #38bdf8; }
textarea {
  width: 100%;
  height: 150px;
  font-size: 17px;
  border-radius: 10px;
  padding: 10px;
  box-sizing: border-box;
}
button {
  background: #0284c7;
  color: white;
  padding: 15px 30px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  margin-top: 15px;
}
</style>
</head>
<body>
<h1>🎬 HOKI 쇼츠 메이커</h1>
<p>만들고 싶은 영상 내용을 입력하세요.</p>
<textarea id="prompt" placeholder="예: 아름다운 바다 위로 떠오르는 태양"></textarea>
<br>
<button onclick="makeVideo()">영상 만들기</button>
<p id="result"></p>
<script>
function makeVideo() {
  const p = document.getElementById("prompt").value;
  document.getElementById("result").innerText =
    p ? "✨ 영상 제작 준비 완료! 입력 내용: " + p
      : "먼저 영상 내용을 입력해 주세요.";
}
</script>
</body>
</html>
