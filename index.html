<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>HOKI 2.0 - 쇼츠 메이커</title>
<style>
:root{--bg:#0b1220;--panel:#131e30;--line:#26364d;--text:#f3f6fb;--muted:#a9b6c9;--accent:#7c9cff;--good:#63d6a5}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#101b30,#080d17 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:18px}
.wrap{max-width:1050px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}
.brand span{color:var(--accent)}
.tag{font-size:12px;color:var(--good);border:1px solid #326b5b;border-radius:99px;padding:6px 10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:18px}
.panel{background:rgba(19,30,48,.94);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 35px #0003}
.panel h2{font-size:17px;margin:0 0 14px}
.field{margin:13px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
textarea,input,select{width:100%;background:#0b1423;color:var(--text);border:1px solid #33445e;border-radius:11px;padding:12px;font:inherit;outline:none}
textarea{min-height:105px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
button{border:0;border-radius:11px;padding:12px 15px;font-weight:750;font-size:14px;cursor:pointer;color:#08111f;background:linear-gradient(135deg,#9ab2ff,#b7a2ff)}
button.secondary{background:#26364d;color:var(--text);border:1px solid #3b4c65}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:#0b1423;color:var(--muted);font-size:13px;line-height:1.5;min-height:40px}
.previewBox{display:flex;justify-content:center;align-items:flex-start}
.stage{width:min(100%,300px);aspect-ratio:9/16;background:#111827;border-radius:18px;overflow:hidden;border:1px solid #41516a;box-shadow:0 16px 35px #0007}
.stage canvas{display:block;width:100%;height:100%}
.sceneList{display:grid;gap:8px;margin-top:12px}
.scene{background:#0b1423;border:1px solid #293b55;border-radius:10px;padding:10px;font-size:12px;color:var(--muted)}
.scene b{color:var(--text);display:block;margin-bottom:4px}
.foot{color:#8291a8;font-size:11px;text-align:center;margin:18px 0 4px}
.progress{height:7px;background:#25354d;border-radius:99px;overflow:hidden;margin-top:10px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#7c9cff,#a78bfa);transition:width .15s}
@media(max-width:760px){
body{padding:12px}
.layout{grid-template-columns:1fr}
.previewBox{order:-1}
.stage{width:min(66vw,270px)}
.top{align-items:flex-start}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div class="brand">HOKI <span>2.0</span></div>
<div class="tag">무료 쇼츠 메이커 · 15초</div>
</header>

<main class="layout">
<section class="panel">
<h2>1. 이야기 입력</h2>

<div class="field">
<label for="topic">만들고 싶은 영상의 주제나 문장</label>
<textarea id="topic" placeholder="예: 부모님께 자주 전화드려야 하는 이유. 바쁘다는 핑계로 미루지 말자."></textarea>
<div class="hint">짧은 문장이나 긴 이야기를 입력하면 도입·이야기·마무리 3장면으로 나눠요.</div>
</div>

<div class="field">
<label for="style">영상 분위기</label>
<select id="style">
<option value="warm">따뜻하고 감성적인</option>
<option value="hope">희망적이고 힘이 되는</option>
<option value="calm">차분하고 잔잔한</option>
<option value="bold">강렬하고 단호한</option>
</select>
</div>

<div class="field">
<label for="signature">마지막 서명 (선택)</label>
<input id="signature" maxlength="24" value="오늘도 당신을 응원합니다">
</div>

<div class="btns">
<button id="makeBtn">장면 자동 구성</button>
<button class="secondary" id="previewBtn">미리보기 재생</button>
<button class="secondary" id="stopBtn">정지</button>
</div>

<div class="sceneList" id="sceneList">
<div class="scene">아직 장면이 없어요. 주제를 입력하고 ‘장면 자동 구성’을 눌러주세요.</div>
</div>

<div class="btns">
<button id="exportBtn" disabled>15초 영상 저장</button>
</div>

<div class="progress"><div class="bar" id="bar"></div></div>
<div class="status" id="status" aria-live="polite">준비 완료. 주제를 입력해 주세요.</div>

<p class="hint">※ 현재 버전은 입력한 글로 3장면과 자막을 자동 구성하고, 세로 영상 파일로 녹화합니다. AI 음성·외부 이미지 자동 생성은 아직 포함되지 않았어요.</p>
</section>

<aside class="panel">
<h2>2. 세로 영상 미리보기</h2>
<div class="previewBox">
<div class="stage">
<canvas id="canvas" width="540" height="960"></canvas>
</div>
</div>
<div class="hint" style="margin-top:12px">화면 비율 9:16 · 총 15초 · 장면당 약 5초</div>
</aside>
</main>

<div class="foot">HOKI 2.0 · 내 이야기를 짧은 영상으로</div>
</div>

<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('canvas');
const ctx=canvas.getContext('2d');

let scenes=[];
let playing=false;
let raf=0;
let startedAt=0;
let recorder=null;
let recordedChunks=[];

const palettes={
warm:['#372b4d','#b56d72','#ffe1bd'],
hope:['#122b4b','#277b91','#f5e6ad'],
calm:['#17283a','#526d82','#e0e9f0'],
bold:['#351b2b','#a33d4c','#fff0df']
};

function splitText(text){
return text.replace(/\s+/g,' ').trim()
.split(/(?<=[.!?。！？])\s*|(?<=요)\s+|(?<=다)\s+/)
.filter(Boolean);
}

function makeScenes(){
const raw=$('topic').value.trim();

if(!raw){
setStatus('먼저 영상 주제를 입력해 주세요.');
return false;
}

const bits=splitText(raw);
let first=bits[0]||raw;
let middle=bits.slice(1).join(' ')||raw;
let last=$('signature').value.trim()||'오늘도 당신을 응원합니다';

if(raw.length<34){
first=raw;
middle='작은 마음 하나가 하루를 바꾸기도 합니다. 오늘 이 이야기를 기억해 주세요.';
}else if(bits.length===1){
const cut=Math.max(1,Math.floor(raw.length*.58));
first=raw.slice(0,cut);
middle=raw.slice(cut);
}

scenes=[
{title:'잠깐, 생각해 보세요',text:first,kind:'intro'},
{title:'우리에게 필요한 이야기',text:middle,kind:'story'},
{title:'오늘의 한마디',text:last,kind:'end'}
];

$('sceneList').innerHTML=scenes.map((s,i)=>
'<div class="scene"><b>장면 '+(i+1)+' · '+s.title+'</b>'+escapeHtml(s.text)+'</div>'
).join('');

$('exportBtn').disabled=false;
drawScene(0,0);
setStatus('3개 장면을 만들었어요. 미리보기를 확인해 보세요.');
return true;
}

function escapeHtml(s){
return s.replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function wrapLines(text,maxWidth,font){
ctx.font=font;
const words=text.split(' ');
let lines=[];
let line='';

for(const word of words){
const test=line?line+' '+word:word;
if(ctx.measureText(test).width>maxWidth&&line){
lines.push(line);
line=word;
}else{
line=test;
}
}
if(line)lines.push(line);
return lines;
}

function drawScene(index,local){
const s=scenes[index]||{
title:'HOKI 2.0',
text:'당신의 이야기를 짧은 영상으로 만들어 보세요.',
kind:'intro'
};

const p=palettes[$('style').value]||palettes.warm;
const w=canvas.width;
const h=canvas.height;

const grad=ctx.createLinearGradient(0,0,w,h);
grad.addColorStop(0,p[0]);
grad.addColorStop(1,p[1]);
ctx.fillStyle=grad;
ctx.fillRect(0,0,w,h);

ctx.globalAlpha=.12;
for(let i=0;i<14;i++){
ctx.beginPath();
ctx.arc((i*137+80)%w,(i*211+50)%h,30+(i%4)*18,0,Math.PI*2);
ctx.fillStyle=p[2];
ctx.fill();
}
ctx.globalAlpha=1;

ctx.fillStyle=p[2];
ctx.font='bold 25px sans-serif';
ctx.textAlign='center';
ctx.fillText('H O K I   2 . 0',w/2,100);

ctx.fillStyle='rgba(255,255,255,.16)';
roundRect(48,180,w-96,520,28);
ctx.fill();

ctx.fillStyle='#fff';
ctx.font='bold 34px sans-serif';
ctx.fillText(s.title,w/2,260);

const font='bold 39px sans-serif';
const lines=wrapLines(s.text,w-130,font);
ctx.font=font;
ctx.fillStyle='#fff';

let y=390-(Math.min(lines.length,6)-1)*27;

lines.slice(0,8).forEach(line=>{
ctx.fillText(line,w/2,y);
y+=58;
});

ctx.fillStyle='rgba(255,255,255,.75)';
ctx.font='24px sans-serif';
ctx.fillText(
index===2?'끝까지 시청해 주셔서 감사합니다':'당신의 하루에 작은 울림이 되기를',
w/2,790
);

ctx.fillStyle='rgba(255,255,255,.35)';
roundRect(70,870,w-140,9,9);
ctx.fill();

ctx.fillStyle=p[2];
roundRect(70,870,(w-140)*Math.max(0,Math.min(1,local)),9,9);
ctx.fill();
}

function roundRect(x,y,w,h,r){
ctx.beginPath();
ctx.roundRect(x,y,w,h,r);
}

function setStatus(msg){
$('status').textContent=msg;
}

function frame(now){
if(!playing)return;

const elapsed=now-startedAt;
const total=15000;

if(elapsed>=total){
playing=false;
drawScene(2,1);
$('bar').style.width='100%';
setStatus('미리보기 재생이 끝났어요.');
return;
}

const index=Math.min(2,Math.floor(elapsed/5000));
const local=(elapsed%5000)/5000;

drawScene(index,local);
$('bar').style.width=(elapsed/total*100)+'%';
raf=requestAnimationFrame(frame);
}

function play(){
if(!scenes.length&&!makeScenes())return;

cancelAnimationFrame(raf);
playing=true;
startedAt=performance.now();
$('bar').style.width='0%';
setStatus('미리보기를 재생하고 있어요.');
raf=requestAnimationFrame(frame);
}

function stop(){
playing=false;
cancelAnimationFrame(raf);
$('bar').style.width='0%';

if(scenes.length)drawScene(0,0);

setStatus('재생을 멈췄어요.');
}

function supportedMime(){
const types=[
'video/mp4;codecs=avc1.42E01E',
'video/mp4',
'video/webm;codecs=vp9',
'video/webm'
];

for(const t of types){
if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)){
return t;
}
}
return '';
}

async function exportVideo(){
if(!scenes.length&&!makeScenes())return;

if(!canvas.captureStream||!window.MediaRecorder){
setStatus('이 브라우저에서는 영상 녹화를 지원하지 않아요. 아이패드 Safari를 최신 버전으로 업데이트하거나 다른 브라우저에서 시도해 주세요.');
return;
}

const mime=supportedMime();

if(!mime){
setStatus('이 브라우저에서 지원하는 영상 형식을 찾지 못했어요.');
return;
}

$('exportBtn').disabled=true;
$('makeBtn').disabled=true;
$('previewBtn').disabled=true;
recordedChunks=[];

try{
const stream=canvas.captureStream(30);
recorder=new MediaRecorder(stream,{mimeType:mime});

recorder.ondataavailable=e=>{
if(e.data&&e.data.size)recordedChunks.push(e.data);
};

recorder.onerror=()=>{
setStatus('녹화 중 오류가 발생했어요. 다시 시도해 주세요.');
};

recorder.onstop=()=>{
const blob=new Blob(recordedChunks,{
type:recorder.mimeType||mime
});

const url=URL.createObjectURL(blob);
const a=document.createElement('a');

a.href=url;
a.download='HOKI-2.0-shorts.'+(blob.type.includes('mp4')?'mp4':'webm');

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>URL.revokeObjectURL(url),60000);

stream.getTracks().forEach(t=>t.stop());

$('exportBtn').disabled=false;
$('makeBtn').disabled=false;
$('previewBtn').disabled=false;

setStatus('영상 파일 저장을 요청했어요. 파일 앱의 다운로드 폴더를 확인해 주세요. 형식: '+blob.type);
};

recorder.start();

const start=performance.now();

function recordFrame(now){
const elapsed=now-start;

if(elapsed>=15000){
drawScene(2,1);
recorder.stop();
$('bar').style.width='100%';
return;
}

const idx=Math.min(2,Math.floor(elapsed/5000));

drawScene(idx,(elapsed%5000)/5000);
$('bar').style.width=(elapsed/15000*100)+'%';

requestAnimationFrame(recordFrame);
}

setStatus('15초 영상을 녹화하고 있어요. 화면을 닫지 말고 기다려 주세요.');
requestAnimationFrame(recordFrame);

}catch(err){
$('exportBtn').disabled=false;
$('makeBtn').disabled=false;
$('previewBtn').disabled=false;
setStatus('영상 저장을 시작하지 못했어요: '+err.message);
}
}

$('makeBtn').addEventListener('click',makeScenes);
$('previewBtn').addEventListener('click',play);
$('stopBtn').addEventListener('click',stop);
$('exportBtn').addEventListener('click',exportVideo);

drawScene(0,0);

})();
</script>
</body>
</html>
